# Rendered by docker/entrypoint.sh (envsubst).
# Spark runs on the same YARN cluster as MapReduce, with the same container size.
spark.master                          yarn
spark.submit.deployMode               client
spark.driver.memory                   1g
spark.executor.instances              ${SPARK_EXECUTORS}
spark.executor.cores                  1
spark.executor.memory                 ${SPARK_EXECUTOR_HEAP_MB}m
spark.executor.memoryOverhead         ${SPARK_EXECUTOR_OVERHEAD_MB}m
spark.python.worker.memory            256m
spark.yarn.am.memory                  ${SPARK_AM_HEAP_MB}m
spark.yarn.am.memoryOverhead          384m
spark.dynamicAllocation.enabled       false
spark.yarn.jars                       local:/opt/spark/jars/*
spark.pyspark.python                  python3
spark.eventLog.enabled                true
spark.eventLog.dir                    file:///opt/project/results/spark-events
spark.eventLog.logStageExecutorMetrics true
spark.executor.processTreeMetrics.enabled true
spark.ui.showConsoleProgress          false
spark.yarn.maxAppAttempts             1
